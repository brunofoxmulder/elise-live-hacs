name: History tests

on:
  pull_request:
    paths:
      - "custom_components/elise_live/history_tool.py"
      - "tests/test_history_tool.py"
      - ".github/workflows/history-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Home Assistant and pytest
        run: python -m pip install "homeassistant==2026.9.3" pytest
      - name: Run GetHistory tests
        run: python -m pytest -q tests/test_history_tool.py
