name: Élise Live validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integration sources
        run: python -m compileall -q custom_components/elise_live
      - name: Run bridge regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate manifest version
        run: |
          python - <<'PY'
          import json
          manifest=json.load(open("custom_components/elise_live/manifest.json", encoding="utf-8"))
          assert manifest["version"] == "0.1.0-dev.4", manifest
          PY
